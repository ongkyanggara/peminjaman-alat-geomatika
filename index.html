
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Peminjaman Alat Laboratorium Geomatika</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
    <script crossorigin="anonymous" src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root {
            --lab-indigo: #4f46e5;
            --lab-indigo-dark: #312e81;
            --lab-slate: #0f172a;
            --lab-emerald: #059669;
            --lab-orange: #ea580c;
            --lab-red: #dc2626;
        }

        html { scroll-behavior: smooth; }
        body {
            background-image:
                radial-gradient(circle at 10% 4%, rgba(79,70,229,.075), transparent 28%),
                radial-gradient(circle at 90% 10%, rgba(14,165,233,.055), transparent 25%),
                linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
        }

        @keyframes labToastLife {
            0% { opacity: 0; transform: translate3d(36px,-8px,0) scale(.94); filter: blur(5px); }
            10% { opacity: 1; transform: translate3d(0,0,0) scale(1); filter: blur(0); }
            88% { opacity: 1; transform: translate3d(0,0,0) scale(1); }
            100% { opacity: 0; transform: translate3d(16px,-4px,0) scale(.98); }
        }
        @keyframes labToastProgress { from { width: 100%; } to { width: 0%; } }
        @keyframes labSoftPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(79,70,229,.11); }
            50% { box-shadow: 0 0 0 8px rgba(79,70,229,0); }
        }
        @keyframes labShine {
            0% { transform: translateX(-150%) skewX(-18deg); }
            70%, 100% { transform: translateX(280%) skewX(-18deg); }
        }
        @keyframes labFloatIcon {
            0%,100% { transform: translateY(0) rotate(0); }
            50% { transform: translateY(-2px) rotate(2deg); }
        }
        @keyframes labSyncGlow {
            0%,100% { filter: drop-shadow(0 0 0 rgba(79,70,229,0)); }
            50% { filter: drop-shadow(0 0 7px rgba(79,70,229,.48)); }
        }

        .lab-main { position: relative; }
        .lab-main::before {
            content: "";
            position: fixed;
            right: -110px;
            top: -100px;
            width: 420px;
            height: 420px;
            border-radius: 999px;
            background: radial-gradient(circle, rgba(99,102,241,.06), transparent 68%);
            pointer-events: none;
            z-index: 0;
        }

        .lab-sidebar {
            background-image: linear-gradient(180deg, #090f1c 0%, #0f172a 50%, #111827 100%) !important;
            box-shadow: 18px 0 42px rgba(15,23,42,.10);
        }
        .lab-logo {
            transition: transform .3s ease, box-shadow .3s ease;
            box-shadow: 0 14px 32px rgba(15,23,42,.24) !important;
        }
        .lab-logo:hover { transform: translateY(-2px) scale(1.015); }
        .lab-nav-btn { position: relative; overflow: hidden; }
        .lab-nav-btn::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.045), transparent);
            transform: translateX(-120%);
            transition: transform .55s ease;
        }
        .lab-nav-btn:hover::after { transform: translateX(120%); }

        /* Popup notifikasi animatif */
        .lab-toast {
            min-width: 320px;
            max-width: min(440px, calc(100vw - 32px));
            border-radius: 16px !important;
            border: 1px solid rgba(255,255,255,.20) !important;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            overflow: hidden;
            animation: labToastLife 3s cubic-bezier(.22,.9,.2,1) both;
            box-shadow: 0 24px 60px rgba(15,23,42,.30) !important;
        }
        .lab-toast-success { background: linear-gradient(135deg, rgba(4,120,87,.98), rgba(5,150,105,.93)) !important; }
        .lab-toast-error { background: linear-gradient(135deg, rgba(153,27,27,.98), rgba(220,38,38,.93)) !important; }
        .lab-toast::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            height: 3px;
            background: rgba(255,255,255,.85);
            animation: labToastProgress 3s linear both;
        }
        .lab-toast-icon {
            animation: labFloatIcon 1.7s ease-in-out infinite;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,.18));
        }
        .lab-sync-icon { animation: labSyncGlow 1.4s ease-in-out infinite; }

        /* Surface/card profesional tanpa mengubah layout */
        .lab-surface {
            position: relative;
            border-color: rgba(203,213,225,.82) !important;
            box-shadow: 0 10px 28px rgba(15,23,42,.055) !important;
            transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
        }
        .lab-surface:hover {
            transform: translateY(-2px);
            border-color: rgba(129,140,248,.58) !important;
            box-shadow: 0 18px 38px rgba(15,23,42,.085) !important;
        }

        .lab-metric {
            position: relative;
            overflow: hidden;
            isolation: isolate;
            transition: transform .24s ease, box-shadow .24s ease, border-color .24s ease;
            box-shadow: 0 9px 24px rgba(15,23,42,.055) !important;
        }
        .lab-metric::before {
            content: "";
            position: absolute;
            inset: 0 auto 0 0;
            width: 4px;
            opacity: .95;
        }
        .lab-metric::after {
            content: "";
            position: absolute;
            width: 96px;
            height: 96px;
            right: -37px;
            bottom: -48px;
            border-radius: 50%;
            opacity: .11;
            z-index: -1;
        }
        .lab-metric:hover { transform: translateY(-4px); box-shadow: 0 16px 34px rgba(15,23,42,.10) !important; }
        .lab-metric-indigo { background-image: linear-gradient(145deg,#fff 0%,#eef2ff 100%) !important; }
        .lab-metric-indigo::before, .lab-metric-indigo::after { background: #4f46e5; }
        .lab-metric-blue { background-image: linear-gradient(145deg,#fff 0%,#eff6ff 100%) !important; }
        .lab-metric-blue::before, .lab-metric-blue::after { background: #2563eb; }
        .lab-metric-green { background-image: linear-gradient(145deg,#fff 0%,#ecfdf5 100%) !important; }
        .lab-metric-green::before, .lab-metric-green::after { background: #059669; }
        .lab-metric-orange { background-image: linear-gradient(145deg,#fff 0%,#fff7ed 100%) !important; }
        .lab-metric-orange::before, .lab-metric-orange::after { background: #ea580c; }
        .lab-metric-red { background-image: linear-gradient(145deg,#fff 0%,#fef2f2 100%) !important; }
        .lab-metric-red::before, .lab-metric-red::after { background: #dc2626; }
        .lab-icon-tile {
            border-radius: 12px !important;
            transition: transform .25s ease, box-shadow .25s ease;
            animation: labSoftPulse 3.2s ease-in-out infinite;
        }
        .lab-metric:hover .lab-icon-tile { transform: scale(1.06) rotate(-2deg); }

        .lab-alert {
            background-image: linear-gradient(90deg, #fffbeb 0%, #fff7ed 100%) !important;
            box-shadow: 0 10px 28px rgba(217,119,6,.08) !important;
            animation: labSoftPulse 2.8s ease-in-out infinite;
        }

        .lab-analysis-stat {
            position: relative;
            overflow: hidden;
            min-height: 108px;
            transition: transform .24s ease, box-shadow .24s ease;
        }
        .lab-analysis-stat:hover { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(15,23,42,.08); }
        .lab-analysis-stat::after {
            position: absolute;
            right: 16px;
            top: 15px;
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            font-size: 28px;
            opacity: .14;
        }
        .lab-analysis-neutral { background-image: linear-gradient(145deg,#f8fafc,#eef2ff) !important; }
        .lab-analysis-neutral::after { content: "\f080"; color: #4f46e5; }
        .lab-analysis-primary { background-image: linear-gradient(145deg,#eef2ff,#e0e7ff) !important; }
        .lab-analysis-primary::after { content: "\f135"; color: #4338ca; }
        .lab-analysis-low { background-image: linear-gradient(145deg,#f8fafc,#f1f5f9) !important; }
        .lab-analysis-low::after { content: "\f063"; color: #64748b; }

        .lab-insight {
            background-image: linear-gradient(120deg,#172033 0%,#1e293b 54%,#312e81 155%) !important;
            box-shadow: 0 16px 34px rgba(15,23,42,.16) !important;
            position: relative;
            overflow: hidden;
        }
        .lab-insight::after {
            content: "";
            position: absolute;
            width: 190px;
            height: 190px;
            right: -75px;
            top: -95px;
            border-radius: 50%;
            background: rgba(99,102,241,.16);
        }

        .lab-filter {
            border-radius: 10px !important;
            background: #fff !important;
            box-shadow: 0 4px 12px rgba(15,23,42,.04);
            transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
        }
        .lab-filter:focus {
            border-color: #6366f1 !important;
            box-shadow: 0 0 0 4px rgba(99,102,241,.12) !important;
            transform: translateY(-1px);
        }

        .lab-report-btn {
            position: relative;
            overflow: hidden;
            background-image: linear-gradient(135deg,#312e81 0%,#4f46e5 55%,#6366f1 100%) !important;
            border-color: #4338ca !important;
            box-shadow: 0 9px 22px rgba(79,70,229,.22) !important;
            transition: transform .22s ease, box-shadow .22s ease !important;
        }
        .lab-report-btn::before {
            content: "";
            position: absolute;
            top: -25%;
            left: -45%;
            width: 32%;
            height: 150%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.34), transparent);
            animation: labShine 3.4s ease-in-out infinite;
        }
        .lab-report-btn:hover {
            transform: translateY(-2px) scale(1.015);
            box-shadow: 0 14px 30px rgba(79,70,229,.30) !important;
        }
        .lab-report-btn i { filter: drop-shadow(0 2px 4px rgba(0,0,0,.18)); }
        .lab-section-icon { filter: drop-shadow(0 3px 5px rgba(79,70,229,.18)); }

        main input, main select, main textarea {
            transition: border-color .2s ease, box-shadow .2s ease, background-color .2s ease;
        }
        main table tbody tr { transition: background-color .18s ease, box-shadow .18s ease; }
        main table tbody tr:hover { box-shadow: inset 3px 0 0 #6366f1; }

        @media (max-width: 640px) {
            .lab-toast { left: 16px; right: 16px; top: 16px; min-width: 0; }
        }
        @media (prefers-reduced-motion: reduce) {
            .lab-toast, .lab-icon-tile, .lab-alert, .lab-report-btn::before, .lab-toast-icon, .lab-sync-icon { animation: none !important; }
            .lab-surface, .lab-metric, .lab-analysis-stat, .lab-report-btn { transition: none !important; }
        }
    

        /* ==========================================================
           DYNAMIC PROFESSIONAL THEME - VISUAL ONLY
           ========================================================== */
        @keyframes labBgDrift {
            0%,100% { transform: translate3d(0,0,0) scale(1); opacity: .72; }
            50% { transform: translate3d(-18px,14px,0) scale(1.06); opacity: 1; }
        }
        @keyframes labAdminPulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(52,211,153,.36); }
            50% { box-shadow: 0 0 0 7px rgba(52,211,153,0); }
        }
        @keyframes labBorderFlow {
            0%,100% { opacity: .48; }
            50% { opacity: .92; }
        }

        body {
            background:
                radial-gradient(circle at 11% 7%, rgba(99,102,241,.10), transparent 27%),
                radial-gradient(circle at 90% 13%, rgba(14,165,233,.10), transparent 25%),
                radial-gradient(circle at 70% 88%, rgba(16,185,129,.07), transparent 26%),
                linear-gradient(145deg,#f8fafc 0%,#eef2ff 48%,#f0fdfa 100%) !important;
        }
        .lab-app-shell { background: transparent !important; }
        .lab-main {
            background:
                linear-gradient(135deg, rgba(248,250,252,.80), rgba(238,242,255,.68) 52%, rgba(240,253,250,.62));
            isolation: isolate;
        }
        .lab-main::before {
            width: 520px !important;
            height: 520px !important;
            right: -170px !important;
            top: -160px !important;
            background: radial-gradient(circle, rgba(99,102,241,.13), rgba(59,130,246,.055) 42%, transparent 70%) !important;
            animation: labBgDrift 12s ease-in-out infinite;
        }
        .lab-main::after {
            content: "";
            position: fixed;
            left: 19%;
            bottom: -230px;
            width: 560px;
            height: 560px;
            border-radius: 999px;
            background: radial-gradient(circle, rgba(16,185,129,.09), rgba(14,165,233,.045) 44%, transparent 70%);
            pointer-events: none;
            z-index: -1;
            animation: labBgDrift 15s ease-in-out infinite reverse;
        }

        .lab-sidebar {
            background:
                radial-gradient(circle at 12% 8%, rgba(99,102,241,.22), transparent 22%),
                radial-gradient(circle at 90% 70%, rgba(14,165,233,.10), transparent 28%),
                linear-gradient(180deg,#070b16 0%,#0f172a 48%,#111827 100%) !important;
            border-right-color: rgba(99,102,241,.18) !important;
        }
        .lab-sidebar > div:first-child {
            background: linear-gradient(180deg,rgba(2,6,23,.82),rgba(15,23,42,.72)) !important;
        }
        .lab-nav-btn {
            min-height: 57px;
            backdrop-filter: blur(9px);
            -webkit-backdrop-filter: blur(9px);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.025);
        }
        .lab-nav-btn:hover {
            transform: translateX(3px);
            background: rgba(255,255,255,.045);
        }
        .lab-nav-btn.lab-nav-active { transform: translateX(4px); }
        .lab-nav-btn i {
            width: 34px !important;
            height: 34px;
            border-radius: 10px;
            display: inline-flex !important;
            align-items: center;
            justify-content: center;
            transition: transform .24s ease, box-shadow .24s ease, background-color .24s ease;
        }
        .lab-nav-dashboard i { background: rgba(99,102,241,.15); color: #a5b4fc; }
        .lab-nav-inventory i { background: rgba(14,165,233,.14); color: #7dd3fc; }
        .lab-nav-borrow i { background: rgba(16,185,129,.14); color: #6ee7b7; }
        .lab-nav-transactions i { background: rgba(245,158,11,.14); color: #fcd34d; }
        .lab-nav-btn:hover i, .lab-nav-active i { transform: scale(1.08) rotate(-3deg); box-shadow: 0 8px 18px rgba(0,0,0,.18); }

        .lab-surface {
            background: linear-gradient(145deg,rgba(255,255,255,.98),rgba(248,250,252,.93)) !important;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            overflow: hidden;
        }
        .lab-surface::before {
            content: "";
            position: absolute;
            left: 0; right: 0; top: 0;
            height: 3px;
            background: linear-gradient(90deg,#4f46e5,#0ea5e9,#10b981,#f59e0b,#ef4444);
            opacity: .52;
            animation: labBorderFlow 4.5s ease-in-out infinite;
            pointer-events: none;
        }
        .lab-surface > * { position: relative; z-index: 1; }

        .lab-report-btn {
            background: linear-gradient(135deg,#7f1d1d 0%,#dc2626 36%,#4f46e5 100%) !important;
            border-color: rgba(248,113,113,.6) !important;
            box-shadow: 0 10px 26px rgba(220,38,38,.20), 0 8px 24px rgba(79,70,229,.14) !important;
        }
        .lab-report-icon {
            width: 30px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 9px;
            background: rgba(255,255,255,.16);
            color: #fecaca;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.16);
        }
        .lab-admin-mini {
            display: inline-flex;
            align-items: center;
            padding: 3px 7px;
            border-radius: 999px;
            font-size: 8px;
            line-height: 1;
            letter-spacing: .12em;
            background: rgba(255,255,255,.16);
            border: 1px solid rgba(255,255,255,.20);
            color: #fff;
        }
        .lab-admin-status {
            color: #a7f3d0;
            border-color: rgba(52,211,153,.26) !important;
            background: linear-gradient(135deg,rgba(6,78,59,.52),rgba(15,23,42,.68));
            box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 8px 20px rgba(0,0,0,.14);
        }
        .lab-admin-status-icon {
            width: 30px; height: 30px;
            border-radius: 9px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: #6ee7b7;
            background: rgba(16,185,129,.14);
        }
        .lab-admin-live {
            width: 8px; height: 8px;
            border-radius: 999px;
            background: #34d399;
            animation: labAdminPulse 1.7s ease-in-out infinite;
        }
        .lab-share-btn {
            color: #e0e7ff;
            border: 1px solid rgba(129,140,248,.28);
            background: linear-gradient(135deg,rgba(49,46,129,.75),rgba(30,41,59,.86));
            box-shadow: 0 8px 18px rgba(0,0,0,.14);
        }
        .lab-share-btn:hover {
            transform: translateY(-1px);
            color: white;
            border-color: rgba(129,140,248,.48);
            background: linear-gradient(135deg,rgba(67,56,202,.88),rgba(30,64,175,.72));
        }

        /* Memberi warna lebih kuat pada elemen informasi penting tanpa mengubah layout */
        main h2, main h3 { letter-spacing: -.015em; }
        main h3 .lab-section-icon {
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: linear-gradient(135deg,#eef2ff,#dbeafe);
            border: 1px solid #c7d2fe;
            margin-right: 10px !important;
            vertical-align: middle;
        }
        main button:not(.lab-nav-btn):not(.lab-report-btn) { transition: transform .2s ease, box-shadow .2s ease, filter .2s ease; }
        main button:not(.lab-nav-btn):not(.lab-report-btn):hover { transform: translateY(-1px); filter: saturate(1.06); }

        @media (prefers-reduced-motion: reduce) {
            .lab-main::before, .lab-main::after, .lab-admin-live, .lab-surface::before { animation: none !important; }
        }


        /* FRESH DASHBOARD CHARTS + ROOM-AWARE MM SCHEDULE */
        @keyframes labBarReveal { from { transform: scaleX(0); opacity:.35; } to { transform: scaleX(1); opacity:1; } }
        @keyframes labRoomGlow { 0%,100% { box-shadow:0 0 0 0 rgba(14,165,233,.10); } 50% { box-shadow:0 0 0 5px rgba(14,165,233,0); } }
        .lab-room-badge { width:max-content; max-width:100%; display:inline-flex; align-items:center; gap:6px; padding:4px 7px; border-radius:8px; color:#0369a1; background:linear-gradient(135deg,#f0f9ff,#e0f2fe); border:1px solid #bae6fd; font-size:9px; font-weight:900; letter-spacing:.04em; animation:labRoomGlow 3.2s ease-in-out infinite; }
        .lab-room-badge i { color:#0284c7; font-size:9px; }
        .lab-modern-chart { background:radial-gradient(circle at 100% 0%,rgba(99,102,241,.055),transparent 32%),linear-gradient(145deg,#fff 0%,#fbfdff 62%,#f8fafc 100%) !important; }
        .lab-chart-live { display:inline-flex; align-items:center; gap:5px; padding:5px 8px; border-radius:999px; color:#047857; background:#ecfdf5; border:1px solid #a7f3d0; font-size:8px; font-weight:900; letter-spacing:.12em; white-space:nowrap; }
        .lab-chart-live i { color:#10b981; font-size:6px; animation:labAdminPulse 1.7s ease-in-out infinite; }
        .lab-chart-live-blue { color:#4338ca; background:#eef2ff; border-color:#c7d2fe; }
        .lab-chart-live-blue i { color:#6366f1; font-size:9px; animation:none; }
        .lab-donut-interactive { transition:transform .28s ease,filter .28s ease,box-shadow .28s ease; filter:saturate(1.05); box-shadow:0 18px 38px rgba(79,70,229,.12),inset 0 0 0 1px rgba(255,255,255,.72)!important; }
        .lab-donut-interactive:hover { transform:scale(1.055) rotate(1deg); filter:saturate(1.18); box-shadow:0 24px 46px rgba(79,70,229,.18)!important; }
        .lab-donut-center { transition:transform .28s ease,box-shadow .28s ease; }
        .lab-donut-interactive:hover .lab-donut-center { transform:scale(.97); box-shadow:0 12px 28px rgba(15,23,42,.10)!important; }
        .lab-category-row { padding:8px 9px; border-radius:10px; border:1px solid transparent; transition:transform .2s ease,background .2s ease,border-color .2s ease,box-shadow .2s ease; }
        .lab-category-row:hover { transform:translateX(3px); background:#f8fafc; border-color:#e2e8f0; box-shadow:0 8px 20px rgba(15,23,42,.05); }
        .lab-category-dot { width:9px; height:9px; border-radius:999px; flex:0 0 auto; box-shadow:0 0 0 3px rgba(148,163,184,.10); }
        .lab-percent-pill { min-width:42px; text-align:center; padding:3px 7px; border-radius:999px; color:#312e81; background:#eef2ff; border:1px solid #c7d2fe; font-size:10px; font-weight:900; }
        .lab-mini-track,.lab-dual-track { height:5px; border-radius:999px; overflow:hidden; background:#eef2f7; box-shadow:inset 0 1px 2px rgba(15,23,42,.05); }
        .lab-mini-fill,.lab-dual-fill { height:100%; border-radius:inherit; transform-origin:left center; animation:labBarReveal .85s cubic-bezier(.2,.8,.2,1) both; }
        .lab-tool-rank-card { padding:10px 11px; border-radius:12px; border:1px solid #e2e8f0; background:linear-gradient(135deg,#fff,#f8fafc); transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease,background .22s ease; }
        .lab-tool-rank-card:hover { transform:translateY(-2px) translateX(2px); border-color:#c7d2fe; background:linear-gradient(135deg,#fff,#eef2ff); box-shadow:0 12px 26px rgba(79,70,229,.08); }

            return (React.createElement("div", { className: "flex flex-col items-center justify-center gap-1.5" },
                React.createElement("span", { className: "bg-red-50 text-red-700 px-3 py-1.5 rounded text-xs font-bold shadow-sm border border-red-200 w-max text-center animate-pulse uppercase tracking-wider" },

                    " Terlambat"),
                React.createElement("span", { className: "text-[10px] font-bold text-white bg-red-600 px-2 py-1 rounded shadow-sm" },
                    "Telat ",
                    latenessStr)));
        }
        const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const mins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
        const secs = Math.floor((diffMs % (1000 * 60)) / 1000);
        const timeString = `${hours.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        if (days > 2) {
            return (React.createElement("div", { className: "flex flex-col items-center justify-center gap-1.5" },

                React.createElement("span", { className: "bg-white border border-slate-300 text-slate-700 px-2 py-1 rounded shadow-sm text-[11px] font-mono font-bold flex items-center" },

                    timeString)));

        else if (days > 0) {
            return (React.createElement("div", { className: "flex flex-col items-center justify-center gap-1.5" },
                React.createElement("span", { className: "bg-amber-50 text-amber-700 px-3 py-1 rounded text-[11px] font-bold border border-amber-300 w-max text-center uppercase tracking-wide" },
                    "Mendekati (H-",
                    days,
                    ")"),
                React.createElement("span", { className: "bg-white border border-amber-200 text-amber-700 px-2 py-1 rounded shadow-sm text-[11px] font-mono font-bold flex items-center" },
                    React.createElement("i", { className: "fas fa-hourglass-half mr-1.5 text-amber-500" }),

        }
        else {
            return (React.createElement("div", { className: "flex flex-col items-center justify-center gap-1.5" },
                React.createElement("span", { className: "bg-orange-50 text-orange-700 px-3 py-1 rounded text-[11px] font-bold border border-orange-300 w-max text-center uppercase tracking-wide" },
                    React.createElement("i", { className: "fas fa-exclamation-triangle mr-1" }),
                    " Hari Ini"),
                React.createElement("span", { className: "bg-orange-500 text-white px-2 py-1 rounded shadow-sm text-[11px] font-mono font-bold flex items-center animate-pulse" },
                    React.createElement("i", { className: "fas fa-stopwatch mr-1.5" }),

    // ============================================================
    // SINKRONISASI DATABASE SPREADSHEET - 3 APPS SCRIPT (ISOLATED)
    // PERBAIKAN KHUSUS:
    // - Log transaksi SELALU dibaca dari GOOGLE_SCRIPT_URL.
    // - Inventaris + Jadwal SELALU dibaca dari MASTER_DATA_URL.
    // - Kotak Saran tetap memakai GOOGLE_SCRIPT_INV_FEEDBACK_URL.
    // - Tidak ada sessionStorage/BroadcastChannel yang dapat menimpa
    //   data transaksi dari tab/versi website lain.
    // - Jika salah satu endpoint lambat/gagal, data endpoint lain tetap tampil.
    // ============================================================
    const normalizeTransactionPayload = (payload) => {
        if (Array.isArray(payload)) return payload;
        if (payload && Array.isArray(payload.transactions)) return payload.transactions;
        // Compatibility untuk variasi response Apps Script lama.
        if (payload && Array.isArray(payload.data)) return payload.data;
        if (payload && Array.isArray(payload.records)) return payload.records;
        return [];
    };

    const normalizeMasterInventory = (masterData) => Array.isArray(masterData?.inventory)
        ? masterData.inventory.map(item => {
            const total = Number(item.total) || 0;
            return {
                id: String(item.id || '').trim(),
                category: String(item.category || '').trim(),
                name: String(item.name || '').trim(),
                total,
                available: total
            };
        }).filter(item => item.id)
        : [];

    const normalizeMasterSchedule = (masterData) => Array.isArray(masterData?.schedule)
        ? masterData.schedule.map(item => ({
            id: String(item.id || '').trim(),
            lab: String(item.lab || 'GT').trim().toUpperCase(),
            room: String(item.room || '').trim(),
            day: Number(item.day),
            course: String(item.course || '').trim(),
            class: String(item.class || '').trim(),
            start: String(item.start || '').substring(0, 5),
            end: String(item.end || '').substring(0, 5)
        })).filter(item =>
            item.id && item.course &&
            Number.isFinite(item.day) &&
            item.start && item.end
        )
        : [];

    const fetchDatabase = async ({ silent = false, force = false } = {}) => {
        const now = Date.now();
        if (!force && now - lastSyncAttemptRef.current < 5000)
            return false;
        if (syncInProgressRef.current)
            return false;

        if (!GOOGLE_SCRIPT_URL || !MASTER_DATA_URL || MASTER_DATA_URL.includes('PASTE_MASTER_DATA_WEB_APP_URL_HERE')) {
            if (!silent)
                showNotification('Konfigurasi database belum lengkap. Periksa URL transaksi dan MASTER_DATA_URL.', 'error');
            return false;
        }

        lastSyncAttemptRef.current = now;
        syncInProgressRef.current = true;
        if (!silent)
            setIsSyncing(true);

        const controller = new AbortController();
        syncAbortRef.current = controller;
        const timeoutId = setTimeout(() => controller.abort(), 15000);

        try {
            // Kedua endpoint dijalankan paralel, tetapi hasilnya diproses TERPISAH.
            // Dengan demikian kegagalan Master Data tidak mengosongkan Log Transaksi,
            // dan kegagalan endpoint transaksi tidak menghapus Inventaris/Jadwal.
            const txPromise = fetch(GOOGLE_SCRIPT_URL, {
                method: 'GET',
                cache: 'no-store',
                signal: controller.signal
            }).then(async response => {
                if (!response.ok) throw new Error(`HTTP Transaksi ${response.status}`);
                const rawText = await response.text();
                if (!rawText) throw new Error('Respons transaksi kosong');
                const payload = JSON.parse(rawText);
                if (payload && payload.error) throw new Error(payload.error);
                return { rawText, payload };
            });

            const masterPromise = fetch(`${MASTER_DATA_URL}?resource=master`, {
                method: 'GET',
                cache: 'no-store',
                signal: controller.signal
            }).then(async response => {
                if (!response.ok) throw new Error(`HTTP Master Data ${response.status}`);
                const rawText = await response.text();
                if (!rawText) throw new Error('Respons master data kosong');
                const payload = JSON.parse(rawText);
                if (payload && payload.error) throw new Error(payload.error);
                if (payload && payload.ok === false)
                    throw new Error(payload.error || 'Master Data menolak permintaan.');
                return { rawText, payload };
            });

            const [txResult, masterResult] = await Promise.allSettled([txPromise, masterPromise]);

            let txSuccess = false;
            let masterSuccess = false;
            let formattedTxForInventory = transactions;
            let finalInventoryMaster = baseInventory;

            // 1. TRANSAKSI: sumber tunggal GOOGLE_SCRIPT_URL
            if (txResult.status === 'fulfilled') {
                const txData = normalizeTransactionPayload(txResult.value.payload);
                const formattedTx = txData.map(trx => ({
                    ...trx,
                    borrowDateFormatted: trx.borrowDate
                        ? parseRealDate(trx.borrowDate).toLocaleDateString('id-ID')
                        : '-'
                }));

                formattedTxForInventory = formattedTx;
                setTransactions(formattedTx);
                txSuccess = true;
            } else {
                console.error('Endpoint transaksi gagal:', txResult.reason);
                // PENTING: jangan setTransactions([]). Data yang sudah tampil dipertahankan.
            }

            // 2. MASTER DATA: hanya Inventaris + Jadwal
            if (masterResult.status === 'fulfilled') {
                const masterData = masterResult.value.payload;
                finalInventoryMaster = normalizeMasterInventory(masterData);
                const finalSchedule = normalizeMasterSchedule(masterData);

                setBaseInventory(finalInventoryMaster);
                setScheduleData(finalSchedule);
                masterSuccess = true;
            } else {
                console.error('Endpoint master data gagal:', masterResult.reason);
                // PENTING: jangan kosongkan Inventaris/Jadwal yang sudah tampil.
            }

            // Hitung stok menggunakan kombinasi data terbaru yang berhasil didapat.
            if (txSuccess || masterSuccess) {
                setInventory(calculateInventory(formattedTxForInventory, finalInventoryMaster));
            }

            // Registrasi baru hanya diizinkan jika transaksi + master data sama-sama fresh.
            setIsDatabaseReady(txSuccess && masterSuccess);

            if (txSuccess && masterSuccess) {
                lastServerPayloadRef.current = `${txResult.value.rawText}|||${masterResult.value.rawText}`;
                return true;
            }

            // Jika salah satu sumber berhasil, UI tetap menampilkan data yang tersedia.
            if (!silent) {
                if (!txSuccess && masterSuccess) {
                    showNotification('Inventaris dan jadwal tersinkron, tetapi Log Transaksi belum berhasil dimuat. Sistem akan mencoba kembali.', 'error');
                } else if (txSuccess && !masterSuccess) {
                    showNotification('Log Transaksi berhasil dimuat, tetapi Master Inventaris/Jadwal belum tersinkron.', 'error');
                }
            }
            return txSuccess || masterSuccess;
        }
        catch (error) {
            if (error.name === 'AbortError')
                console.warn('Sinkronisasi database timeout setelah 15 detik.');
            else
                console.error('Gagal sinkronisasi database:', error);

            if (!silent) {
                showNotification(error.name === 'AbortError'
                    ? 'Database sedang lambat. Data yang sudah tampil tetap dipertahankan dan sinkronisasi akan dicoba kembali.'
                    : 'Gagal terhubung ke database. Data yang sudah tampil tidak dihapus.', 'error');
            }
            return false;
        }
        finally {
            clearTimeout(timeoutId);
            syncAbortRef.current = null;
            syncInProgressRef.current = false;
            if (!silent)
                setIsSyncing(false);
        }
    };

    // Refresh ulang sesudah operasi POST agar UI kembali mengikuti Spreadsheet.
    const refreshDatabaseAfterWrite = (delay = 900) => {
        setTimeout(() => {
            fetchDatabase({ silent: true, force: true });
        }, delay);
    };

    useEffect(() => {
        const timer = setInterval(() => setCurrentTime(new Date()), 1000);

        // Sinkronisasi pertama setelah UI dirender.
        const initialSyncTimer = setTimeout(() => {
            fetchDatabase({ silent: false, force: true });
        }, 0);

        // Struktur lama dipertahankan: sinkronisasi background saat tab aktif.
        const backgroundSyncTimer = setInterval(() => {
            if (document.visibilityState === 'visible') {
                fetchDatabase({ silent: true });
            }
        }, 30000);

        const handleVisibilityChange = () => {
            if (document.visibilityState === 'visible') {
                fetchDatabase({ silent: true });
            }
        };

        document.addEventListener('visibilitychange', handleVisibilityChange);

        return () => {
            clearInterval(timer);
            clearTimeout(initialSyncTimer);
            clearInterval(backgroundSyncTimer);
            document.removeEventListener('visibilitychange', handleVisibilityChange);
            if (syncAbortRef.current)
                syncAbortRef.current.abort();
        };
    }, []);

    const submitBorrow = async (e) => {
        e.preventDefault();
        // Transaksi baru hanya boleh dikirim setelah pembacaan awal Spreadsheet berhasil.
        if (!isDatabaseReady) {

            fetchDatabase({ silent: false, force: true });
            return;

        if (!borrowForm.borrowerName || !borrowForm.nim || !borrowForm.whatsapp || !borrowForm.purpose || !borrowForm.borrowDate || !borrowForm.borrowTime || !borrowForm.returnDateEst || !borrowForm.returnTimeEst || borrowForm.items.length === 0 || !borrowForm.fileBase64) {

        if (borrowForm.purpose === 'Praktikum') {

            if (borrowForm.praktikumCourse === 'Layanan Praktikum GT' && !borrowForm.praktikumLayanan) {

        for (let item of borrowForm.items) {

            const inventoryItem = inventory.find(i => i.id === item.itemId);

                return showNotification(`Stok ${inventoryItem.name} tidak mencukupi! (Tersedia: ${inventoryItem.available})`, 'error');
            }
        }
        setIsSubmitting(true);
        const newTransactionId = createUniqueTransactionId();
        const alatLengkap = borrowForm.items.map(item => {

        });
        let finalPurpose = borrowForm.purpose;
        if (borrowForm.purpose === 'Praktikum') {
            if (borrowForm.praktikumCourse === 'Layanan Praktikum GT') {
                finalPurpose = `Praktikum - ${borrowForm.praktikumCourse} (${borrowForm.praktikumLayanan}) - Kelas ${borrowForm.praktikumClass}`;

        }
        const borrowerWhatsapp = normalizeWhatsAppNumber(borrowForm.whatsapp);
        const borrowerNameSnapshot = String(borrowForm.borrowerName || '').trim();
        const borrowerNimSnapshot = String(borrowForm.nim || '').trim();
        const payload = {
            action: "create", id: newTransactionId, borrowerName: borrowerNameSnapshot, nim: borrowerNimSnapshot, purpose: finalPurpose,
            borrowDate: borrowForm.borrowDate, borrowTime: borrowForm.borrowTime, returnDateEst: borrowForm.returnDateEst, returnTimeEst: borrowForm.returnTimeEst,
            approvalFileName: borrowForm.approvalFileName, fileBase64: borrowForm.fileBase64, mimeType: borrowForm.mimeType, items: alatLengkap,
            whatsapp: borrowerWhatsapp
        };
        try {
            const newTransaction = { ...payload, whatsapp: borrowerWhatsapp, status: 'active', borrowDateFormatted: new Date(borrowForm.borrowDate).toLocaleDateString('id-ID') };
            const updatedTransactions = [newTransaction, ...transactions];
            setTransactions(updatedTransactions);
            setInventory(calculateInventory(updatedTransactions, baseInventory));
            setBorrowForm({
                borrowerName: '', nim: '', whatsapp: '', purpose: '', praktikumCourse: '', praktikumClass: '', praktikumLayanan: '',
                borrowDate: new Date().toISOString().split('T')[0], borrowTime: '',
                returnDateEst: '', returnTimeEst: '', items: [{ itemId: '', quantity: 1 }], approvalFileName: '', fileBase64: '', mimeType: ''
            });
            if (fileInputRef.current)
                fileInputRef.current.value = "";
            setActiveTab('transactions');
            showNotification('Memproses peminjaman...');
            await fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' },

            if (borrowerWhatsapp) {

                setWhatsappDirectory(prev => ({

                if (MASTER_DATA_URL && !MASTER_DATA_URL.includes('PASTE_MASTER_DATA_WEB_APP_URL_HERE')) {

                            method: 'POST',

                                action: 'saveWhatsApp',

                            })

                    } catch (waError) {

                    }
                }
            }
            // Setelah penulisan, ambil kembali data resmi dari Spreadsheet.
            refreshDatabaseAfterWrite();
            if (isAdmin && adminCredential) {
                setTimeout(() => fetchAdminWhatsAppDirectory(adminCredential, false), 1200);
            }
            showNotification('Peminjaman berhasil dikirim ke Database Spreadsheet!');
        }
        catch (error) {
            console.error('Info pengiriman fetch error:', error);
            showNotification('Gagal mengirim data ke Spreadsheet. Silakan coba kembali.', 'error');
        }
        finally {
            setIsSubmitting(false);
        }
    };

        // --- DATA JADWAL PRAKTIKUM ---

        };
        const rawSchedule = scheduleData;
        const timeToMins = (t) => {
            const [h, m] = t.split(':').map(Number);
            return h * 60 + m;
        };
        const processedSchedule = rawSchedule.map(item => {
            const startMins = timeToMins(item.start);
            const endMins = timeToMins(item.end);
            const overlaps = rawSchedule.filter(other => other.lab === item.lab &&
                (!item.room || !other.room || other.room === item.room) &&
                other.day === item.day &&
                other.id !== item.id &&
                timeToMins(other.start) < endMins &&
                timeToMins(other.end) > startMins);
            return {
                ...item,
                startMins,
                endMins,
                isOverlap: overlaps.length > 0
            };
        }).sort((a, b) => {
            if (a.day !== b.day)
                return a.day - b.day;
            return a.startMins - b.startMins;
        });
        const selectedSchedule = processedSchedule.filter(item => item.lab === scheduleLab);
        const todayDay = currentTime.getDay() || 7; // Sunday = 7
        const currentMins = currentTime.getHours() * 60 + currentTime.getMinutes();
        let nextPracticum = null;
        let minMinsAway = Infinity;
        const activePracticums = [];
        selectedSchedule.forEach(item => {
            if (item.day === todayDay && currentMins >= item.startMins && currentMins <= item.endMins) {
                activePracticums.push(item);
            }
            let dayDiff = item.day - todayDay;

                }

                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('p', 'mm', 'a4');
                const generatedAt = new Date();
                const marginX = 14;
                const mainCategoriesReport = ['Total Station', 'GNSS', 'Laser Scanner', 'Hidrografi', 'Theodolite', 'Leveling', 'Fotogrametri'];

                const safeNumber = (v) => Number.isFinite(Number(v)) ? Number(v) : 0;
                const cleanText = (v) => String(v == null || v === '' ? '-' : v);
                const formatPdfDate = (date) => {
                    if (!(date instanceof Date) || Number.isNaN(date.getTime())) return '-';
                    return date.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
                };
                const formatPdfTime = (date) => {
                    if (!(date instanceof Date) || Number.isNaN(date.getTime())) return '-';
                    return date.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', hour12: false }).replace(/\./g, ':') + ' WIB';
                };
                const formatDateTime = (date) => `${formatPdfDate(date)} ${formatPdfTime(date)}`;
                const formatDurationCompact = (ms) => {
                    if (!Number.isFinite(ms) || ms <= 0) return '0 menit';
                    const totalMinutes = Math.floor(ms / 60000);
                    const days = Math.floor(totalMinutes / 1440);
                    const hours = Math.floor((totalMinutes % 1440) / 60);
                    const minutes = totalMinutes % 60;
                    const parts = [];
                    if (days) parts.push(`${days} hari`);
                    if (hours) parts.push(`${hours} jam`);
                    if (minutes || parts.length === 0) parts.push(`${minutes} menit`);
                    return parts.join(' ');
                };
                const purposeGroup = (purpose) => {
                    const p = String(purpose || 'Lainnya').trim();
                    if (/^Praktikum/i.test(p)) return 'Praktikum';
                    if (/^Tugas akhir/i.test(p)) return 'Tugas Akhir';
                    if (/^Penelitian/i.test(p)) return 'Penelitian';
                    if (/^Proyek/i.test(p)) return 'Proyek';
                    return 'Lainnya';
                };
                const getOperationalStatus = (trx) => {
                    const start = parseTargetDate(trx.borrowDate, trx.borrowTime);
                    const due = parseTargetDate(trx.returnDateEst, trx.returnTimeEst);
                    let returned = null;
                    let effectiveEnd = currentTime;
                    let label = 'Sedang Dipinjam';
                    let key = 'active';
                    let latenessMs = 0;

                    if (trx.status && trx.status.startsWith('completed')) {
                        if (trx.status.includes('|')) {
                            const parsedReturn = new Date(trx.status.split('|')[1].replace(' ', 'T'));
                            if (!Number.isNaN(parsedReturn.getTime())) returned = parsedReturn;
                        }
                        effectiveEnd = returned || due;
                        if (returned && returned.getTime() > due.getTime()) {
                            label = 'Selesai Terlambat';
                            key = 'completedLate';
                            latenessMs = returned.getTime() - due.getTime();
                        } else {
                            label = 'Selesai Tepat Waktu';
                            key = 'completedOnTime';
                        }
                    } else if (due.getTime() <= currentTime.getTime()) {
                        label = 'Aktif Terlambat';
                        key = 'activeLate';
                        latenessMs = currentTime.getTime() - due.getTime();
                    }

                    const durationMs = Math.max(0, effectiveEnd.getTime() - start.getTime());
                    let timeNote = '';
                    if (key === 'active') timeNote = `Sisa ${formatDurationCompact(Math.max(0, due.getTime() - currentTime.getTime()))}`;
                    else if (key === 'activeLate' || key === 'completedLate') timeNote = `Terlambat ${formatDurationCompact(latenessMs)}`;
                    else timeNote = 'Sesuai tenggat';

                    return { start, due, returned, effectiveEnd, label, key, latenessMs, durationMs, timeNote };
                };

                const statusMeta = {
                    active: { label: 'Sedang Dipinjam', color: [79, 70, 229] },
                    activeLate: { label: 'Aktif Terlambat', color: [220, 38, 38] },
                    completedOnTime: { label: 'Selesai Tepat Waktu', color: [5, 150, 105] },
                    completedLate: { label: 'Selesai Terlambat', color: [234, 88, 12] }
                };
                const statusCounts = { active: 0, activeLate: 0, completedOnTime: 0, completedLate: 0 };
                const purposeMap = {};
                const borrowerMap = {};
                const itemMap = {};
                let totalUnitUsage = 0;
                let totalTransactionHours = 0;
                let totalLateMinutes = 0;

                const detailedRows = filteredTx.map((trx, index) => {
                    const status = getOperationalStatus(trx);
                    statusCounts[status.key] += 1;
                    totalTransactionHours += status.durationMs / 3600000;
                    totalLateMinutes += status.latenessMs / 60000;

                    const purpose = purposeGroup(trx.purpose);
                    purposeMap[purpose] = (purposeMap[purpose] || 0) + 1;

                    const borrowerKey = String(trx.nim || '').trim() || String(trx.borrowerName || '').trim().toLowerCase() || `unknown-${index}`;
                    if (!borrowerMap[borrowerKey]) {
                        borrowerMap[borrowerKey] = {
                            name: cleanText(trx.borrowerName),
                            nim: cleanText(trx.nim),
                            transactions: 0,
                            units: 0,
                            hours: 0,
                            late: 0
                        };
                    }
                    borrowerMap[borrowerKey].transactions += 1;
                    borrowerMap[borrowerKey].hours += status.durationMs / 3600000;
                    if (status.key === 'activeLate' || status.key === 'completedLate') borrowerMap[borrowerKey].late += 1;

                    const itemLines = [];
                    (Array.isArray(trx.items) ? trx.items : []).forEach(item => {
                        const code = String(item.kode || item.id || '-').trim() || '-';
                        const rawName = String(item.nama || item.name || 'Instrumen').replace(/^\[[^\]]+\]\s*/, '').trim();
                        const qty = Math.max(1, parseInt(item.jumlah || item.quantity || 1) || 1);
                        const invItem = inventory.find(inv => inv.id === code || inv.name === rawName);
                        const category = invItem ? invItem.category : 'Lainnya';
                        const itemKey = code !== '-' ? code : rawName.toLowerCase();
                        totalUnitUsage += qty;
                        borrowerMap[borrowerKey].units += qty;

                        if (!itemMap[itemKey]) {
                            itemMap[itemKey] = { code, name: rawName, category, count: 0, hours: 0 };
                        }
                        itemMap[itemKey].count += qty;
                        itemMap[itemKey].hours += (status.durationMs / 3600000) * qty;
                        itemLines.push(`[${code}] ${rawName} (${qty} unit)`);
                    });

                    return {
                        no: index + 1,
                        id: cleanText(trx.id),
                        borrower: cleanText(trx.borrowerName),
                        nim: cleanText(trx.nim),
                        purpose: cleanText(trx.purpose),
                        borrowText: formatDateTime(status.start),
                        dueText: formatDateTime(status.due),
                        returnText: status.returned ? formatDateTime(status.returned) : '-',
                        status: status.label,
                        statusKey: status.key,
                        timeNote: status.timeNote,
                        duration: formatDurationCompact(status.durationMs),
                        items: itemLines.length ? itemLines.join('\n') : '-'
                    };
                });

                const uniqueBorrowers = Object.keys(borrowerMap).length;
                const lateTotal = statusCounts.activeLate + statusCounts.completedLate;
                const completedTotal = statusCounts.completedOnTime + statusCounts.completedLate;
                const lateRate = filteredTx.length ? Math.round((lateTotal / filteredTx.length) * 100) : 0;
                const onTimeCompletedRate = completedTotal ? Math.round((statusCounts.completedOnTime / completedTotal) * 100) : 0;
                const lateCompletedRate = completedTotal ? 100 - onTimeCompletedRate : 0;
                const activeTotal = statusCounts.active + statusCounts.activeLate;
                const activeLateRate = activeTotal ? Math.round((statusCounts.activeLate / activeTotal) * 100) : 0;
                const complianceLabel = completedTotal === 0 ? 'Belum Dinilai'
                    : onTimeCompletedRate >= 90 ? 'Sangat Baik'
                    : onTimeCompletedRate >= 80 ? 'Baik'
                    : onTimeCompletedRate >= 70 ? 'Cukup'
                    : 'Perlu Perbaikan';
                const avgTransactionHours = filteredTx.length ? totalTransactionHours / filteredTx.length : 0;

                const purposeData = Object.entries(purposeMap)
                    .map(([name, count]) => ({ name, count }))
                    .sort((a, b) => b.count - a.count);
                const borrowerData = Object.values(borrowerMap)
                    .map(item => ({ ...item, hours: Math.round(item.hours * 10) / 10 }))
                    .sort((a, b) => b.transactions - a.transactions || b.hours - a.hours || b.units - a.units);
                const borrowerDurationData = [...borrowerData].sort((a, b) => b.hours - a.hours || b.transactions - a.transactions);
                const allTools = Object.values(itemMap)
                    .map(item => ({ ...item, hours: Math.round(item.hours * 10) / 10, avgHours: item.count ? Math.round((item.hours / item.count) * 10) / 10 : 0 }))
                    .sort((a, b) => b.count - a.count);
                const mainTools = allTools.filter(item => mainCategoriesReport.includes(item.category));
                const strategicTools = [...mainTools].sort((a, b) => b.count - a.count || b.hours - a.hours);
                const mainToolsByDuration = [...mainTools].sort((a, b) => b.hours - a.hours || b.count - a.count);

                const borrowDates = detailedRows.map(r => parseTargetDate(filteredTx[r.no - 1].borrowDate, filteredTx[r.no - 1].borrowTime)).filter(d => !Number.isNaN(d.getTime())).sort((a, b) => a - b);
                const periodText = borrowDates.length
                    ? `${formatPdfDate(borrowDates[0])} s.d. ${formatPdfDate(borrowDates[borrowDates.length - 1])}`
                    : 'Tidak tersedia';
                const filterLabel = txFilter === 'Semua' ? 'Semua Status' : txFilter;
                const fullFilterLabel = `${filterLabel} | ${archivePeriodLabel}`;
                const reportCode = `LGT-${generatedAt.getFullYear()}${String(generatedAt.getMonth() + 1).padStart(2, '0')}${String(generatedAt.getDate()).padStart(2, '0')}-${String(generatedAt.getHours()).padStart(2, '0')}${String(generatedAt.getMinutes()).padStart(2, '0')}`;

                const addHeader = (title, subtitle = '') => {
                    const pw = doc.internal.pageSize.getWidth();
                    doc.setFillColor(15, 23, 42);
                    doc.rect(0, 0, pw, 31, 'F');
                    doc.setFillColor(79, 70, 229);
                    doc.rect(0, 0, 5, 31, 'F');
                    doc.setTextColor(255, 255, 255);
                    doc.setFont('helvetica', 'bold');
                    doc.setFontSize(13);
                    doc.text('INSTITUT TEKNOLOGI SUMATERA', marginX, 10);
                    doc.setFontSize(8.5);
                    doc.setFont('helvetica', 'normal');
                    doc.text('PROGRAM STUDI TEKNIK GEOMATIKA | LABORATORIUM GEOMATIKA', marginX, 16);
                    doc.setFontSize(11.5);
                    doc.setFont('helvetica', 'bold');
                    doc.text(title, marginX, 24);
                    if (subtitle) {
                        doc.setFontSize(7.5);
                        doc.setFont('helvetica', 'normal');
                        doc.text(subtitle, pw - marginX, 24, { align: 'right' });
                    }
                    doc.setTextColor(15, 23, 42);
                };
                const sectionTitle = (title, y, width = null) => {
                    const pw = doc.internal.pageSize.getWidth();
                    const w = width || (pw - marginX * 2);
                    doc.setFillColor(238, 242, 255);
                    doc.roundedRect(marginX, y - 4, w, 9, 1.5, 1.5, 'F');
                    doc.setTextColor(55, 48, 163);
                    doc.setFont('helvetica', 'bold');
                    doc.setFontSize(9.5);
                    doc.text(title, marginX + 4, y + 1.5);
                    doc.setTextColor(15, 23, 42);
                    return y + 10;
                };
                const metricCard = (x, y, w, label, value, note, accent = [79, 70, 229]) => {
                    doc.setFillColor(248, 250, 252);
                    doc.setDrawColor(226, 232, 240);
                    doc.roundedRect(x, y, w, 26, 2, 2, 'FD');
                    doc.setFillColor(...accent);
                    doc.roundedRect(x, y, 2.5, 26, 1, 1, 'F');
                    doc.setFont('helvetica', 'bold');
                    doc.setFontSize(6.8);
                    doc.setTextColor(100, 116, 139);
                    doc.text(label.toUpperCase(), x + 5, y + 6);
                    doc.setFontSize(15);
                    doc.setTextColor(15, 23, 42);
                    doc.text(String(value), x + 5, y + 15);
                    doc.setFont('helvetica', 'normal');
                    doc.setFontSize(6.5);
                    doc.setTextColor(100, 116, 139);
                    const lines = doc.splitTextToSize(note || '', w - 9);
                    doc.text(lines.slice(0, 2), x + 5, y + 20);
                };
                const barChart = (items, y, title, valueKey = 'count', suffix = '', maxItems = 6, barColor = [79, 70, 229]) => {
                    const pw = doc.internal.pageSize.getWidth();
                    const contentW = pw - marginX * 2;
                    y = sectionTitle(title, y, contentW);
                    const data = items.slice(0, maxItems);
                    if (!data.length) {
                        doc.setFontSize(8);
                        doc.setTextColor(100, 116, 139);
                        doc.text('Belum ada data.', marginX + 2, y + 3);
                        return y + 10;
                    }
                    const maxVal = Math.max(...data.map(v => safeNumber(v[valueKey])), 1);
                    const labelW = 58;
                    const chartX = marginX + labelW;
                    const chartW = contentW - labelW - 27;
                    data.forEach((item, idx) => {
                        const rowY = y + idx * 9;
                        const value = safeNumber(item[valueKey]);
                        doc.setFont('helvetica', idx === 0 ? 'bold' : 'normal');
                        doc.setFontSize(7.2);
                        doc.setTextColor(51, 65, 85);
                        const label = doc.splitTextToSize(`${idx + 1}. ${item.name || '-'}`, labelW - 4)[0];
                        doc.text(label, marginX, rowY + 4);
                        doc.setFillColor(241, 245, 249);
                        doc.roundedRect(chartX, rowY + 1, chartW, 4, 1, 1, 'F');
                        doc.setFillColor(...(idx === 0 ? barColor : barColor.map(v => Math.min(255, v + 45))));
                        doc.roundedRect(chartX, rowY + 1, Math.max(1, value / maxVal * chartW), 4, 1, 1, 'F');
                        doc.setFont('helvetica', 'bold');
                        doc.setFontSize(7);
                        doc.setTextColor(30, 41, 59);
                        doc.text(`${value.toLocaleString('id-ID')}${suffix}`, pw - marginX, rowY + 4.2, { align: 'right' });
                    });
                    return y + data.length * 9 + 4;
                };
                const statusChart = (y) => {
                    const pw = doc.internal.pageSize.getWidth();
                    const contentW = pw - marginX * 2;
                    y = sectionTitle('Distribusi Status Transaksi', y, contentW);
                    const total = filteredTx.length || 1;
                    let x = marginX;
                    const barY = y + 2;
                    Object.keys(statusMeta).forEach(key => {
                        const count = statusCounts[key];
                        if (!count) return;
                        const w = (count / total) * contentW;
                        doc.setFillColor(...statusMeta[key].color);
                        doc.rect(x, barY, w, 7, 'F');
                        x += w;
                    });
                    let legendY = barY + 13;
                    let legendX = marginX;
                    Object.keys(statusMeta).forEach(key => {
                        const meta = statusMeta[key];
                        const count = statusCounts[key];
                        const pct = Math.round((count / total) * 100);
                        doc.setFillColor(...meta.color);
                        doc.circle(legendX + 2, legendY - 1, 1.5, 'F');
                        doc.setFont('helvetica', 'normal');
                        doc.setFontSize(6.6);
                        doc.setTextColor(71, 85, 105);
                        const label = `${meta.label}: ${count} (${pct}%)`;
                        doc.text(label, legendX + 5, legendY);
                        legendX += 45;
                        if (legendX > pw - 55) {
                            legendX = marginX;
                            legendY += 6;
                        }
                    });
                    return legendY + 7;
                };
                const complianceChart = (y) => {
                    const pw = doc.internal.pageSize.getWidth();
                    const contentW = pw - marginX * 2;
                    y = sectionTitle('Penilaian Kepatuhan Pengembalian', y, contentW);
                    doc.setFont('helvetica', 'normal');
                    doc.setFontSize(7.2);
                    doc.setTextColor(71, 85, 105);
                    if (!completedTotal) {
                        doc.text('Belum terdapat transaksi selesai pada periode/filter ini sehingga persentase ketepatan waktu belum dapat dinilai.', marginX + 2, y + 2);
                        return y + 12;
                    }
                    const barY = y + 3;
                    const greenW = contentW * (onTimeCompletedRate / 100);
                    doc.setFillColor(5, 150, 105);
                    if (greenW > 0) doc.rect(marginX, barY, greenW, 8, 'F');
                    doc.setFillColor(234, 88, 12);
                    if (greenW < contentW) doc.rect(marginX + greenW, barY, contentW - greenW, 8, 'F');
                    doc.setFont('helvetica', 'bold');
                    doc.setFontSize(8);
                    doc.setTextColor(5, 150, 105);
                    doc.text(`TEPAT WAKTU ${onTimeCompletedRate}% (${statusCounts.completedOnTime})`, marginX, barY + 14);
                    doc.setTextColor(194, 65, 12);
                    doc.text(`TERLAMBAT ${lateCompletedRate}% (${statusCounts.completedLate})`, pw - marginX, barY + 14, { align: 'right' });
                    doc.setTextColor(51, 65, 85);
                    doc.setFont('helvetica', 'normal');
                    doc.setFontSize(7.2);
                    doc.text(`Penilaian kepatuhan: ${complianceLabel} | Basis penilaian: ${completedTotal} transaksi yang sudah selesai.`, marginX, barY + 20);
                    if (statusCounts.activeLate > 0) {
                        doc.setTextColor(185, 28, 28);
                        doc.text(`Catatan operasional: ${statusCounts.activeLate} transaksi aktif masih melewati tenggat (${activeLateRate}% dari transaksi aktif).`, marginX, barY + 25);
                    }
                    return barY + 31;
                };

                const dominantPurpose = purposeData[0] || null;
                const topBorrower = borrowerData[0] || null;
                const topTool = strategicTools[0] || null;
                const topDurationTool = mainToolsByDuration[0] || null;
                const topBorrowerDuration = borrowerDurationData[0] || null;
                const analysisParts = [];
                analysisParts.push(`Pada periode ${periodText}, tercatat ${filteredTx.length} transaksi yang melibatkan ${uniqueBorrowers} peminjam dan ${totalUnitUsage} unit-pemakaian alat.`);
                if (dominantPurpose) analysisParts.push(`Kebutuhan ${dominantPurpose.name} merupakan aktivitas paling dominan dengan ${dominantPurpose.count} transaksi.`);
                if (topTool) analysisParts.push(`Instrumen utama dengan frekuensi pemakaian tertinggi adalah ${topTool.name} (${topTool.code}) sebanyak ${topTool.count} unit-pemakaian.`);
                if (topDurationTool) analysisParts.push(`Durasi penggunaan alat utama tertinggi tercatat pada ${topDurationTool.name} (${topDurationTool.code}) sebesar ${topDurationTool.hours.toLocaleString('id-ID')} jam.`);
                if (lateTotal > 0) analysisParts.push(`Terdapat ${lateTotal} transaksi berstatus terlambat (${lateRate}% dari seluruh transaksi pada filter ini), terdiri atas ${statusCounts.activeLate} transaksi yang masih aktif melewati tenggat dan ${statusCounts.completedLate} transaksi yang selesai setelah tenggat.`);
                else analysisParts.push('Tidak terdapat transaksi terlambat pada data yang masuk dalam kriteria laporan.');
                if (completedTotal > 0) analysisParts.push(`Dari ${completedTotal} transaksi yang sudah selesai, ${onTimeCompletedRate}% dikembalikan tepat waktu dan ${lateCompletedRate}% dikembalikan terlambat; penilaian kepatuhan: ${complianceLabel}.`);
                if (topBorrower) analysisParts.push(`${topBorrower.name} tercatat sebagai peminjam dengan aktivitas tertinggi, yaitu ${topBorrower.transactions} transaksi dan ${topBorrower.units} unit alat.`);
                if (topBorrowerDuration) analysisParts.push(`Akumulasi durasi peminjaman tertinggi tercatat pada ${topBorrowerDuration.name} sebesar ${topBorrowerDuration.hours.toLocaleString('id-ID')} jam.`);
                const analysisText = analysisParts.join(' ');

                // HALAMAN 1 - RINGKASAN EKSEKUTIF
                addHeader('LAPORAN OPERASIONAL PEMINJAMAN & PENGGUNAAN ALAT', `Dokumen: ${reportCode}`);
                doc.setFont('helvetica', 'normal');
                doc.setFontSize(7.5);
                doc.setTextColor(100, 116, 139);
                doc.text(`Periode data: ${periodText} | Filter: ${fullFilterLabel} | Dicetak: ${formatDateTime(generatedAt)}`, marginX, 38);
                doc.setTextColor(220, 38, 38);
                doc.setFont('helvetica', 'bold');
                doc.text('DOKUMEN INTERNAL - MODE ADMIN', doc.internal.pageSize.getWidth() - marginX, 38, { align: 'right' });

                const contentW = doc.internal.pageSize.getWidth() - marginX * 2;
                const gap = 3.5;
                const cardW = (contentW - gap * 3) / 4;
                metricCard(marginX, 44, cardW, 'Total Transaksi', filteredTx.length, `${uniqueBorrowers} peminjam unik`, [79, 70, 229]);
                metricCard(marginX + cardW + gap, 44, cardW, 'Tepat Waktu', `${onTimeCompletedRate}%`, `${statusCounts.completedOnTime}/${completedTotal || 0} transaksi selesai`, [5, 150, 105]);
                metricCard(marginX + (cardW + gap) * 2, 44, cardW, 'Terlambat Selesai', `${lateCompletedRate}%`, `${statusCounts.completedLate}/${completedTotal || 0} transaksi selesai`, [234, 88, 12]);
                metricCard(marginX + (cardW + gap) * 3, 44, cardW, 'Aktif Terlambat', statusCounts.activeLate, `${activeLateRate}% dari transaksi aktif`, [220, 38, 38]);

                let y = statusChart(79);
                y = complianceChart(y + 1);
                y = sectionTitle('Analisis Eksekutif', y + 2, contentW);
                doc.setFont('helvetica', 'normal');
                doc.setFontSize(8.4);
                doc.setTextColor(51, 65, 85);
                const analysisLines = doc.splitTextToSize(analysisText, contentW - 4);
                doc.text(analysisLines, marginX + 2, y);
                y += analysisLines.length * 4.3 + 6;

                const operationalNotes = [];
                if (statusCounts.activeLate > 0) operationalNotes.push(`Prioritas segera: tindak lanjuti ${statusCounts.activeLate} transaksi aktif yang telah melewati tenggat pengembalian.`);
                if (lateRate >= 20) operationalNotes.push(`Rasio keterlambatan ${lateRate}% tergolong signifikan; pengingat otomatis menjelang tenggat dan evaluasi kepatuhan peminjam direkomendasikan.`);
                if (topTool) operationalNotes.push(`Prioritaskan pemeriksaan kondisi dan kesiapan ${topTool.name} (${topTool.code}) karena memiliki intensitas pemakaian tertinggi.`);
                if (!operationalNotes.length) operationalNotes.push('Kinerja pengembalian pada filter ini terkendali; pertahankan proses pengingat, inspeksi alat, dan dokumentasi serah terima.');

                y = sectionTitle('Rekomendasi Operasional', y + 2, contentW);
                doc.setFontSize(8.1);
                operationalNotes.forEach((note, idx) => {
                    const lines = doc.splitTextToSize(`${idx + 1}. ${note}`, contentW - 5);
                    doc.text(lines, marginX + 2, y);
                    y += lines.length * 4.1 + 2;
                });

                // HALAMAN 2 - GRAFIK ALAT UTAMA
                doc.addPage('a4', 'portrait');
                addHeader('ANALISIS PEMANFAATAN ALAT UTAMA', `Filter: ${fullFilterLabel}`);
                y = 42;
                y = barChart(purposeData, y, 'Grafik Jenis Kegiatan Peminjaman', 'count', ' trx', 5, [5, 150, 105]);
                y = barChart(strategicTools, y + 2, 'Grafik Frekuensi Alat Utama', 'count', 'x', 8, [79, 70, 229]);
                y = barChart(mainToolsByDuration, y + 2, 'Grafik Durasi Penggunaan Alat Utama', 'hours', ' jam', 8, [124, 58, 237]);

                // HALAMAN 3 - GRAFIK PEMINJAM (frekuensi + durasi)
                doc.addPage('a4', 'portrait');
                addHeader('ANALISIS PEMINJAM', `Filter: ${fullFilterLabel}`);
                y = 42;
                const borrowerChartData = borrowerData.slice(0, 8).map(b => ({ name: `${b.name} (${b.nim})`, count: b.transactions }));
                const borrowerDurationChartData = borrowerDurationData.slice(0, 8).map(b => ({ name: `${b.name} (${b.nim})`, hours: b.hours }));
                y = barChart(borrowerChartData, y, 'Grafik Frekuensi Peminjaman per Peminjam', 'count', ' trx', 8, [14, 116, 144]);
                y = barChart(borrowerDurationChartData, y + 2, 'Grafik Akumulasi Durasi Peminjaman per Peminjam', 'hours', ' jam', 8, [2, 132, 199]);
                if (y < 250) {
                    y = sectionTitle('Indikator Penggunaan', y + 2, contentW);
                    doc.setFont('helvetica', 'normal');
                    doc.setFontSize(8);
                    doc.setTextColor(71, 85, 105);
